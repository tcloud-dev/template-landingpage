<section id="registration" class="registration">
  <div class="container">
    <h2 class="section-title">Inscreva-se no Evento</h2>

    @if (submitted) {
      <div class="success-message">
        <h3>✓ Inscrição realizada com sucesso!</h3>
        <p>Você receberá um e-mail de confirmação em breve.</p>
      </div>
    } @else if (error) {
      <div class="error-message">
        <h3>✗ Erro ao realizar inscrição</h3>
        <p>{{ error }}</p>
        <button type="button" class="retry-button" (click)="clearError()">Tentar Novamente</button>
      </div>
    } @else {
      <form class="registration-form" (ngSubmit)="onSubmit()" #registrationForm="ngForm">
        <div class="form-row">
          <div class="form-group">
            <label for="nomeCompleto">Nome Completo *</label>
            <input
              type="text"
              id="nomeCompleto"
              name="nomeCompleto"
              [(ngModel)]="formData.nomeCompleto"
              required
              placeholder="Digite seu nome completo"
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="formData.email"
              required
              email
              placeholder="seu@email.com"
            >
          </div>
          <div class="form-group">
            <label for="telefone">Celular *</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              [(ngModel)]="formData.telefone"
              required
              placeholder="(00) 00000-0000"
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF *</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              [(ngModel)]="formData.cpf"
              required
              placeholder="000.000.000-00"
            >
          </div>
          <div class="form-group">
            <label for="empresa">Empresa</label>
            <input
              type="text"
              id="empresa"
              name="empresa"
              [(ngModel)]="formData.empresa"
              placeholder="Nome da empresa (opcional)"
            >
          </div>
        </div>

        <button
          type="submit"
          class="submit-button"
          [disabled]="!registrationForm.form.valid || isSubmitting"
        >
          {{ isSubmitting ? 'Enviando...' : 'Confirmar Inscrição' }}
        </button>
      </form>
    }
  </div>
</section>
